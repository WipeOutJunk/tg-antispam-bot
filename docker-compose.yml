
services:
  anti-spam-bot:
    build: .
    container_name: anti-spam-telegram-bot
    restart: unless-stopped
    
    env_file:
      - app/.env
    
    volumes:
      # Named volumes - данные сохраняются при пересборке
      - bot-data:/app/data
      
      # Bind mount для логов - легко читать на хосте
      - ./logs:/app/logs
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
    driver: local

  
